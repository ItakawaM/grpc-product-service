syntax = "proto3";

package productservice.v1;

import "buf/validate/validate.proto";
import "google/protobuf/timestamp.proto";

message Product {
  string id = 1;
  string name = 2;
  string description = 3;
  uint32 price_cents = 4;
  google.protobuf.Timestamp created_at = 5;
  google.protobuf.Timestamp updated_at = 6;
  google.protobuf.Timestamp deleted_at = 7;
  uint32 version = 8;
}

message CreateProductRequest {
  string name = 1 [(buf.validate.field).string = {min_len: 1, max_len: 200}];
  string description = 2 [(buf.validate.field).string.max_len = 2000];
  uint32 price_cents = 3 [(buf.validate.field).uint32 = {gt: 0}];
}

message CreateProductResponse {
  Product product = 1;
}

message GetProductRequest {
  string id = 1 [(buf.validate.field).string.uuid = true];
}

message GetProductResponse {
  Product product = 1;
}

service ProductService {
  rpc CreateProduct(CreateProductRequest) returns (CreateProductResponse);
  rpc GetProduct(GetProductRequest) returns (GetProductResponse);
}